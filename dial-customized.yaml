# Wifi information
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password  


captive_portal:

time:
  - platform: homeassistant
    id: esptime

  
rc522_i2c:
  i2c_id:  bus_internal
  address: 0x28
  on_tag:
    then:
      - rtttl.play: "success:d=24,o=5,b=100:c,g,b"
      - homeassistant.tag_scanned: !lambda 'return x;'

spi:
  mosi_pin: GPIO5
  clk_pin: GPIO6

display:
- platform: gc9a01
  reset_pin: GPIO8
  id: my_lcd
  cs_pin: GPIO7
  dc_pin: GPIO4
  rotation: 90
  pages:
    - id: page1
      lambda: |-
        float screenheight = it.get_height();
        float screenwidth = it.get_width();
        float halfscreenheight = screenheight / 2;
        float halfscreenwidth = screenwidth /2;
        if (id(mediastate).state == "playing")
        {
          it.image(halfscreenwidth, halfscreenheight-80, media_play, ImageAlign::TOP_CENTER);
          it.printf(halfscreenwidth, halfscreenheight + 35, id(roboto16), TextAlign::TOP_CENTER, id(now_playing).state.c_str());
          it.printf(halfscreenwidth, halfscreenheight + 20, id(roboto16), TextAlign::TOP_CENTER, id(now_playing_artist).state.c_str());

        }
        else if (id(mediastate).state == "paused")
        {
          it.image(halfscreenwidth, halfscreenheight-80, media_paused, ImageAlign::TOP_CENTER);        
          it.printf(halfscreenwidth, halfscreenheight + 35, id(roboto16), TextAlign::TOP_CENTER, id(now_playing).state.c_str());
          it.printf(halfscreenwidth, halfscreenheight + 20, id(roboto16), TextAlign::TOP_CENTER, id(now_playing_artist).state.c_str());

        }
        else
        {
          it.strftime(halfscreenwidth, halfscreenheight-70, id(roboto24), TextAlign::TOP_CENTER, "%a %b %d", id(esptime).now());
          it.strftime(halfscreenwidth, halfscreenheight-40, id(roboto60), TextAlign::TOP_CENTER, "%H:%M", id(esptime).now());
          it.printf(halfscreenwidth, halfscreenheight+30, id(roboto24), TextAlign::TOP_CENTER, "%.1f °F-", id(air_temp).state);
                  
        }

        id(page1binary).publish_state(true);

  on_page_change:
      - to: page1
        then:
          - sensor.rotary_encoder.set_value:
              id: rotaryencoder
              value: !lambda 'return id(beam_volume).state * 100;'
          - component.update: my_lcd

binary_sensor:
  - platform: gpio
    pin: GPIO42
    name: "BacklightButton"
    on_press:
        - if:
            condition:
              - display.is_displaying_page: page1
            then:
              if:
                condition:
                  lambda: return id(mediastate).state == "playing";
                then:
                  - logger.log: 
                      format: "(in pause) The mediaplayer sensor reports value %s"
                      args: [ 'id(mediastate).state' ]
                  - homeassistant.service:
                     service: media_player.media_pause
                     data:
                      entity_id: media_player.plex_plexamp_office
                else:
                  - logger.log: 
                      format: "(in unpause) The mediaplayer sensor reports value %s"
                      args: [ 'id(mediastate).state' ]
                  - homeassistant.service:
                     service: media_player.media_play
                     data:
                      entity_id: media_player.plex_plexamp_office


  - platform: template
    name: "Page 1 Active"
    id: page1binary


sensor:
  - platform: rotary_encoder
    name: "Rotary Encoder"
    id: rotaryencoder
    max_value: 100
    min_value: 0
    pin_a: 
      number: GPIO40
      mode:
       input: true
       pullup: true
    pin_b: 
      number: GPIO41
      mode:
       input: true
       pullup: true
    accuracy_decimals: 1
    on_clockwise: 
       - rtttl.play: quick_e:d=4,o=5,b=100:16e6
       - homeassistant.service:
           service: media_player.volume_up
           data:
             entity_id: media_player.plex_plexamp_office
    on_anticlockwise:
       - rtttl.play: quick_d:d=4,o=5,b=100:16d6
       - homeassistant.service:
           service: media_player.volume_down
           data:
             entity_id: media_player.plex_plexamp_office


  
  - platform: homeassistant
    name: "Media Volume"
    id: "beam_volume"
    entity_id: media_player.plex_plexamp_office
    attribute: volume_level
    
  - platform: homeassistant
    name: "Air Temperature"
    id: "air_temp"
    entity_id: weather.alison_way
    attribute: temperature
    
  
    
light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: oledbacklight
    default_transition_length: 250ms

output:
  - id: oledbacklight
    platform: ledc
    pin: GPIO9
    #pin: GPIO21
    max_power: 1
    min_power: 0
    
  - platform: ledc
    id: buzzer_out
    pin:
      number: GPIO3

# Enable ringtone music support
rtttl:
  id: buzzer
  output: buzzer_out

text_sensor:
  - platform: homeassistant
    name: "Media Player Mute"
    id: "mediaplayermute"
    entity_id: media_player.plex_plexamp_office
    attribute: is_volume_muted
    on_value:
      then:
        - component.update: my_lcd
  - platform: homeassistant
    name: "Media State"
    id: "mediastate"
    entity_id: media_player.plex_plexamp_office
    on_value:
      then:
        - component.update: my_lcd
  - platform: homeassistant
    name: "Now Playing"
    id: "now_playing"
    entity_id: media_player.plex_plexamp_office
    attribute: media_title
    on_value:
      then:
        - component.update: my_lcd
  - platform: homeassistant
    name: "Artist"
    id: "now_playing_artist"
    entity_id: media_player.plex_plexamp_office
    attribute: media_artist
    on_value:
      then:
        - component.update: my_lcd