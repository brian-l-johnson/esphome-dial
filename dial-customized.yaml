# Load secrets from secrets.yaml
substitutions:
  <<: !include secrets.yaml

esphome:
  name: workshop-rotary-test
  friendly_name: workshop-rotary-test
  on_boot:
    priority: 100
    then:
     - logger.log: "Startup - Backlight on"
     - light.turn_on:
         id: backlight
         brightness: 70%
     - lambda: |-
          id(page1binary).publish_state(true);
        # Formatted:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

globals:
  - id: screenwidth
    type: int
    restore_value: no
  - id: max_rotary_value
    type: int
    restore_value: no
    initial_value: '1'
  - id: min_rotary_value
    type: int
    restore_value: no
    initial_value: '100'

external_components:
  - source: github://dgaust/esphome@gc9a01
    components: [ gc9a01 ]

i2c:
  - id: bus_internal
    sda: GPIO11
    scl: GPIO12
  - id: bus_porta
    sda: GPIO13
    scl: GPIO15
#  interrupt: 14

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
